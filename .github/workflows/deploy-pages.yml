name: Deploy AI Infra Wiki to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_REPO: ivanwuzy/aiinfra-wiki-pages
      QUARTZ_BASE_URL: ivanwuzy.github.io/aiinfra-wiki-pages
      QUARTZ_BASE_DIR: /aiinfra-wiki-pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quartz/package-lock.json
      - name: Install dependencies
        working-directory: quartz
        run: npm ci
      - name: Test publishing boundary
        working-directory: quartz
        run: npm run test:publishing
      - name: Synchronize public knowledge
        working-directory: quartz
        run: npm run sync:content
      - name: Configure GitHub Pages URL
        working-directory: quartz
        run: npm run configure:pages -- --base-url "$QUARTZ_BASE_URL"
      - name: Install Quartz plugins
        working-directory: quartz
        run: npx quartz plugin install
      - name: Build Quartz
        working-directory: quartz
        run: npx quartz build --baseDir "$QUARTZ_BASE_DIR"
      - name: Verify built artifact
        working-directory: quartz
        run: npm run verify:public
      - name: Deploy to public Pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ env.PAGES_REPO }}
          publish_branch: main
          publish_dir: quartz/public
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"